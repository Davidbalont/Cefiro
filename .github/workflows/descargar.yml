name: Descargar referencias
on:
  workflow_dispatch:
    inputs:
      urls: {description: "URLs de paginas separadas por espacio", required: true}
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar paginas e imagenes
        run: |
          mkdir -p ref && cd ref
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.parse
          ev = json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"]["urls"].split()
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read()
          for n, page in enumerate(ev):
              d = f"s{n}"; os.makedirs(d, exist_ok=True)
              try:
                  html = get(page).decode("utf-8", "ignore")
              except Exception as ex:
                  print(page, "ERROR", ex); continue
              open(f"{d}/page.html", "w").write(html)
              imgs = set(re.findall(r'(?:src|href|content|data-src)=["\']([^"\']+\.(?:png|jpe?g|svg|webp|gif)(?:\?[^"\']*)?)', html, re.I))
              imgs |= set(re.findall(r'url\(["\']?([^"\')]+\.(?:png|jpe?g|svg|webp))', html, re.I))
              print(page, len(imgs), "imagenes")
              for i, src in enumerate(sorted(imgs)[:60]):
                  u = urllib.parse.urljoin(page, src)
                  name = f"{d}/{i:02d}_" + re.sub(r"[^A-Za-z0-9._-]", "_", os.path.basename(urllib.parse.urlparse(u).path))[-60:]
                  try:
                      b = get(u)
                      if len(b) < 4_000_000: open(name, "wb").write(b)
                  except Exception as ex:
                      print(" fallo", u, ex)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: referencias
          path: ref
          retention-days: 1
